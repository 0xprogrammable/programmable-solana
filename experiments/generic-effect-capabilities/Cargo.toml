[workspace]
members = [
    "crates/generic-effect-private-wire",
    "programs/generic-effect-core",
    "test-programs/effect-engine-probe",
    "test-programs/replacement-effect-engine-probe",
    "test-programs/hostile-router-probe",
    "test-programs/callback-capability-probe",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.89.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
agave-feature-set = "=4.2.1"
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022"] }
base64 = "=0.22.1"
bincode = "=1.3.3"
litesvm = "=0.16.0"
litesvm-cpi-tree = "=0.16.0"
litesvm-loader = "=0.16.0"
litesvm-token = "=0.16.0"
num-bigint = "=0.4.8"
proptest = "=1.5.0"
solana-account = "=4.3.2"
solana-address = "=2.6.1"
solana-address-lookup-table-interface = { version = "=3.1.0", features = ["bincode", "bytemuck"] }
solana-clock = "=3.1.1"
solana-keypair = "=3.1.2"
solana-instructions-sysvar = "=3.0.1"
solana-loader-v3-interface = { version = "=8.0.1", features = ["wincode"] }
solana-message = "=4.2.4"
solana-native-token = "=3.0.0"
solana-program-pack = "=3.1.0"
solana-pubkey = { version = "=3.0.0", features = ["curve25519"] }
solana-sdk-ids = "=3.1.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
solana-signer = "=3.0.1"
solana-slot-hashes = { version = "=3.1.0", features = ["sysvar", "wincode"] }
solana-transaction = "=4.1.5"
uint = { version = "=0.9.5", default-features = false }
wincode = "=0.5.5"

[profile.release]
overflow-checks = true
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
