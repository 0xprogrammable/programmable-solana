[package]
name = "programmable-generic-effect-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Disposable Core for the private generic-effect capability experiment"

[lib]
crate-type = ["cdylib", "lib"]
name = "programmable_generic_effect_core"

[features]
default = ["custom-heap"]
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
bincode.workspace = true
generic-effect-private-wire = { path = "../../crates/generic-effect-private-wire" }
solana-loader-v3-interface.workspace = true
solana-instructions-sysvar.workspace = true
solana-sdk-ids.workspace = true
solana-sha256-hasher.workspace = true
uint.workspace = true

[dev-dependencies]
agave-feature-set.workspace = true
base64.workspace = true
callback-capability-probe = { path = "../../test-programs/callback-capability-probe", features = ["no-entrypoint"] }
effect-engine-probe = { package = "generic-effect-engine-probe", path = "../../test-programs/effect-engine-probe", features = ["no-entrypoint"] }
hostile-router-probe = { path = "../../test-programs/hostile-router-probe", features = ["no-entrypoint"] }
litesvm.workspace = true
litesvm-cpi-tree.workspace = true
litesvm-loader.workspace = true
litesvm-token.workspace = true
num-bigint.workspace = true
proptest.workspace = true
replacement-effect-engine-probe = { path = "../../test-programs/replacement-effect-engine-probe", features = ["no-entrypoint"] }
solana-account.workspace = true
solana-address-lookup-table-interface.workspace = true
solana-clock.workspace = true
solana-keypair.workspace = true
solana-message.workspace = true
solana-native-token.workspace = true
solana-program-pack.workspace = true
solana-sdk-ids.workspace = true
solana-signer.workspace = true
solana-slot-hashes.workspace = true
solana-transaction = { workspace = true, features = ["wincode"] }
wincode.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
