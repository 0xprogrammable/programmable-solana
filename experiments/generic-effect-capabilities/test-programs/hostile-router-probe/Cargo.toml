[package]
name = "hostile-router-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Disposable permissionless and hostile router for the generic-effect experiment"

[lib]
crate-type = ["cdylib", "lib"]
name = "hostile_router_probe"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
callback-capability-probe = { path = "../callback-capability-probe", features = ["no-entrypoint"] }
generic-effect-private-wire = { path = "../../crates/generic-effect-private-wire" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
