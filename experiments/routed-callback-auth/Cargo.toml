[workspace]
members = [
    "crates/routed-callback-probe-wire",
    "programs/routed-callback-core",
    "test-programs/routed-plan-engine",
    "test-programs/hostile-router-probe",
    "test-programs/callback-capability-probe",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.89.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token"] }
base64 = "=0.22.1"
litesvm = "=0.16.0"
litesvm-cpi-tree = "=0.16.0"
litesvm-token = "=0.16.0"
solana-address = "=2.6.1"
solana-account = "=4.3.2"
solana-address-lookup-table-interface = { version = "=3.1.0", features = ["bincode", "bytemuck"] }
solana-clock = "=3.1.1"
solana-keypair = "=3.1.2"
solana-message = "=4.2.4"
solana-native-token = "=3.0.0"
solana-pubkey = "=3.0.0"
solana-program-pack = "=3.1.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
solana-signer = "=3.0.1"
solana-transaction = "=4.1.5"

[profile.release]
overflow-checks = true
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
