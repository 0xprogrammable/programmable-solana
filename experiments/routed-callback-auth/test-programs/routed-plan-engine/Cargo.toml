[package]
name = "routed-plan-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Disposable CPMM engine for the routed callback authentication experiment"

[lib]
crate-type = ["cdylib", "lib"]
name = "routed_plan_engine"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
routed-callback-probe-wire = { path = "../../crates/routed-callback-probe-wire" }
solana-instructions-sysvar = "=3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
